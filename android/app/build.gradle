plugins { id 'com.android.application' }

android {
    namespace 'com.davidefanizza.meteora'
    compileSdk 34

    defaultConfig {
        applicationId "com.davidefanizza.meteora"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("VCODE") ?: "1") as Integer)
        versionName(System.getenv("VNAME") ?: "1.0")
    }

    // Chiave di firma personale (app installata a mano): permette gli aggiornamenti sopra la versione precedente.
    signingConfigs {
        release {
            storeFile file('../keystore/meteora.jks')
            storePassword 'meteora-app'
            keyAlias 'meteora'
            keyPassword 'meteora-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
