name: Meteora
options:
  bundleIdPrefix: com.davidefanizza
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Meteora:
    type: application
    platform: iOS
    sources:
      - path: Meteora
    info:
      path: Meteora/Info.plist
      properties:
        CFBundleDisplayName: Meteora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationQueriesSchemes: [spotify]
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.davidefanizza.meteora
            CFBundleURLSchemes: [meteora]
        NSLocationWhenInUseUsageDescription: "Meteora usa la tua posizione per leggere il meteo e scegliere la musica adatta."
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidefanizza.meteora
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: "NO"
