name: App iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Scegli Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Uso $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Genera il progetto
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compila
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -project Meteora.xcodeproj -scheme Meteora -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Mostra gli errori
        if: failure()
        run: grep -E "error:" ios/build.log | sort -u | head -80

      - name: Crea l'IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Meteora.app Payload/
          zip -qry Meteora.ipa Payload
          ls -la Meteora.ipa

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-v$VERSION" ios/Meteora.ipa \
            --title "Meteora iOS $VERSION" \
            --notes "App nativa per iPhone (iOS 26). Installa con SideStore." \
            --latest

      - name: Aggiorna la sorgente SideStore
        run: |
          SIZE=$(stat -f%z ios/Meteora.ipa)
          python3 - "$VERSION" "${{ github.run_number }}" "$SIZE" <<'PY'
          import json, sys, datetime
          v, build, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          base = "https://davidefanizza-dotcom.github.io/meteora"
          dl = f"https://github.com/davidefanizza-dotcom/meteora/releases/download/ios-v{v}/Meteora.ipa"
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          src = {
            "name": "Meteora",
            "identifier": "com.davidefanizza.meteora.source",
            "subtitle": "La musica che segue il meteo",
            "iconURL": f"{base}/icon-512.png",
            "website": f"{base}/",
            "apps": [{
              "name": "Meteora",
              "bundleIdentifier": "com.davidefanizza.meteora",
              "developerName": "Davide",
              "subtitle": "Spotify + meteo, con Liquid Glass",
              "localizedDescription": "Player Spotify con Meteo Mix: una coda che cambia insieme al meteo.",
              "iconURL": f"{base}/icon-512.png",
              "tintColor": "6D7BFF",
              "category": "entertainment",
              "versions": [{
                "version": v, "buildVersion": build, "date": now,
                "localizedDescription": "Nuova build automatica.",
                "downloadURL": dl, "size": size, "minOSVersion": "26.0"
              }],
              "appPermissions": {"entitlements": [], "privacy": {
                "NSLocationWhenInUseUsageDescription": "Per leggere il meteo della tua zona."}}
            }],
            "news": []
          }
          json.dump(src, open("sidestore.json", "w"), indent=2, ensure_ascii=False)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore.json
          git commit -m "SideStore: Meteora $VERSION [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
